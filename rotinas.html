<script>
  // GUARDA DE ROTA
  (async function verificarLogin() {
    try {
      const API_URL = 'https://albrotinafiscal.contato-782.workers.dev';
      const r = await fetch(`${API_URL}/api/auth/me`, { credentials: 'include' });
      if (!r.ok) { window.location.href = 'login.html'; return; }
      const usuario = await r.json();
      if (!usuario.is_master) {
        document.querySelectorAll('[data-so-master]').forEach(el => { el.style.display = 'none'; });
      }
    } catch (e) { window.location.href = 'login.html'; }
  })();
</script>

<div id="toasts" role="status" aria-live="polite"></div>

<script>
const API_URL = 'https://albrotinafiscal.contato-782.workers.dev';

const REGIMES = { "Simples Nacional": "simples", "Lucro Presumido": "presumido", "Lucro Real": "real" };
let empresas = [];
let regras = {};
let paginaRotinas = 1;
const ITENS_POR_PAGINA = 10;
let termoBuscaRotinas = "";
let empresaAberta = null;

let modalIssEmpresaId = null;
let modalIssCheckboxEl = null;

const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const plural = (n, s, p) => `${n} ${n === 1 ? s : p}`;
const sigla = nome => nome.trim().split(/\s+/).slice(0, 2).map(p => p[0]).join('').toUpperCase();
const ico = n => `<svg class="i" aria-hidden="true"><use href="#i-${n}"/></svg>`;

function toast(msg, erro = false) {
    const el = document.createElement('div');
    el.className = 'toast' + (erro ? ' erro' : '');
    el.innerHTML = ico(erro ? 'alert' : 'check') + `<span>${esc(msg)}</span>`;
    $('toasts').appendChild(el);
    setTimeout(() => el.remove(), 3200);
}

function alternarTema() {
    const novo = document.documentElement.dataset.tema === 'dark' ? 'light' : 'dark';
    document.documentElement.dataset.tema = novo;
    try { localStorage.setItem('tema', novo); } catch (e) {}
}

function reiniciarAnimacao(el) {
    el.style.animation = 'none';
    void el.offsetWidth;
    el.style.animation = '';
}

function formatarDataHora(iso) {
    if (!iso) return '';
    const d = new Date(iso);
    if (isNaN(d.getTime())) return '';
    return new Intl.DateTimeFormat('pt-BR', {
        timeZone: 'America/Sao_Paulo',
        day: '2-digit', month: '2-digit', year: 'numeric',
        hour: '2-digit', minute: '2-digit'
    }).format(d);
}

const OBRIGACOES = [
    { id: 'das',           nome: 'Guia DAS' },
    { id: 'impostoRetido', nome: 'Imposto retido', opcoes: ['IRRF', 'CSRF', 'ISS RET'] },
    { id: 'parcelamento',  nome: 'Parcelamento' },
    { id: 'efdReinf',      nome: 'EFD Reinf' },
    { id: 'destda',        nome: 'DeSTDA' },
    { id: 'efdIcms',       nome: 'EFD ICMS' },
    { id: 'icmsEqSt',      nome: 'ICMS EQ/ST comércio', opcoes: ['EQ', 'ST'] },
    { id: 'revisaoIcms',   nome: 'Revisão ICMS' },
    { id: 'xmlIcmsTrans',  nome: 'XML ICMS trans' },
    { id: 'xmlPrefeitura', nome: 'XML prefeitura', opcoes: ['Prestados', 'Tomados', 'SIEG'] },
    { id: 'aliquotaIss',   nome: 'Alíquota ISS' },
];

function carregarRegras() {
    try { regras = JSON.parse(localStorage.getItem('regras')) || {}; } catch (e) { regras = {}; }
}

// Filtra as obrigações com base no regime e na atividade da empresa
function obrigacoesDoRegime(empresa) {
    const config = regras[empresa.regime];
    if (!config) return [];
    
    const temServicoEmpresa = empresa.tipoTributacao === 'Serviço' || empresa.tipoTributacao === 'Ambos';
    const temComercioEmpresa = empresa.tipoTributacao === 'Comércio' || empresa.tipoTributacao === 'Ambos';

    return OBRIGACOES.filter(o => {
        const regraObrigacao = config[o.id];
        if (regraObrigacao === undefined) return false;

        // Se a regra não tiver tipos (versão antiga), assume que serve pra ambos
        const tipos = regraObrigacao.tipos || { servico: true, comercio: true };
        
        // A regra permite serviço E a empresa tem serviço?
        const okServico = tipos.servico && temServicoEmpresa;
        // A regra permite comércio E a empresa tem comércio?
        const okComercio = tipos.comercio && temComercioEmpresa;

        // Se a regra exige serviço, mas a empresa não tem, oculta.
        // Se a regra exige comércio, mas a empresa não tem, oculta.
        // Se pelo menos um dos tipos que a regra permite bater com a empresa, mostra.
        if (!tipos.servico && !tipos.comercio) return true; // Segurança
        if (tipos.servico && !tipos.comercio && !temServicoEmpresa) return false;
        if (!tipos.servico && tipos.comercio && !temComercioEmpresa) return false;

        return okServico || okComercio || (tipos.servico && tipos.comercio);
    });
}

function competenciaAtualBR() {
  const partes = new Intl.DateTimeFormat('en-CA', {
    timeZone: 'America/Sao_Paulo', year: 'numeric', month: '2-digit'
  }).formatToParts(new Date());
  const ano = partes.find(p => p.type === 'year').value;
  const mes = partes.find(p => p.type === 'month').value;
  return `${ano}-${mes}`;
}

const MESES_PT = ['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];

function rotuloCompetencia(comp) {
  const [ano, mes] = comp.split('-').map(Number);
  return `${MESES_PT[mes - 1]} / ${ano}`;
}

let competenciaAtual = competenciaAtualBR();

function mudarMes(delta) {
  const [ano, mes] = competenciaAtual.split('-').map(Number);
  const d = new Date(ano, mes - 1 + delta, 1);
  const novo = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`;

  if (novo > competenciaAtualBR()) return;

  competenciaAtual = novo;
  atualizarSeletorCompetencia();

  if (empresaAberta) {
      abrirChecklist(empresaAberta.id);
  } else {
      renderizarRotinas();
  }
}

function atualizarSeletorCompetencia() {
  const label = $('competencia-label');
  if (label) label.textContent = rotuloCompetencia(competenciaAtual);
  const labelCheck = $('competencia-label-check');
  if (labelCheck) labelCheck.textContent = rotuloCompetencia(competenciaAtual);

  const prox = $('btn-mes-prox');
  if (prox) prox.disabled = competenciaAtual >= competenciaAtualBR();
  const proxCheck = $('btn-mes-prox-check');
  if (proxCheck) proxCheck.disabled = competenciaAtual >= competenciaAtualBR();
}

async function carregarEmpresasDoBanco() {
    try {
        const resposta = await fetch(`${API_URL}/api/empresas`, { credentials: 'include' });
        if (!resposta.ok) throw new Error('Falha na conexão');
        const dados = await resposta.json();
        empresas = dados.map(e => ({
            id: e.id,
            nomeFantasia: e.nome_fantasia,
            razaoSocial: e.razao_social,
            cnpj: e.cnpj || '',
            regime: e.regime,
            tipoTributacao: e.tipo_tributacao || 'Serviço',
            observacao: e.observacao || ''
        }));
        renderizarRotinas();
    } catch (erro) {
        toast("Erro ao carregar empresas.", true);
        console.error(erro);
    }
}

async function carregarChecklistDaEmpresa(empresaId) {
    try {
        const resposta = await fetch(
            `${API_URL}/api/rotinas/${empresaId}?competencia=${competenciaAtual}`,
            { credentials: 'include' }
        );
        if (!resposta.ok) throw new Error('Falha na conexão');
        const rotinas = await resposta.json();
        const cache = {};
        rotinas.forEach(r => {
            cache[r.obrigacao_id] = {
                concluida: !!r.concluida,
                concluida_em: r.concluida_em || null,
                concluida_por_nome: r.concluida_por_nome || null,
               valor: r.valor || '',
                               canal_envio: r.canal_envio || ''
            };
        });
        return cache;
    } catch (erro) {
        console.error(erro);
        return {};
    }
}

async function toggleChecklistNoBanco(empresaId, obrigacaoId, concluida, valor = null) {
    try {
        const resposta = await fetch(`${API_URL}/api/rotinas/toggle`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            credentials: 'include',
            body: JSON.stringify({ empresaId, obrigacaoId, concluida, competencia: competenciaAtual, valor })
        });
        if (!resposta.ok) throw new Error('Erro ao atualizar');
        return true;
    } catch (erro) {
        console.error(erro);
        toast("Erro ao atualizar o checklist no banco.", true);
        return false;
    }
}

let modalDasEmpresaId = null;
let modalDasCheckboxEl = null;

function abrirModalDas(empresaId, valorAtual, checkboxEl) {
    modalDasEmpresaId = empresaId;
    modalDasCheckboxEl = checkboxEl;
    const dlg = $('dlg-das');
    $('select-das').value = valorAtual || '';
    if (!dlg.open) dlg.showModal();
}

function fecharModalDas() {
    $('dlg-das').close();
    if (modalDasCheckboxEl) modalDasCheckboxEl.checked = false;
}

function confirmarModalDas() {
    const valor = $('select-das').value;
    if (!valor) {
        toast("Selecione um canal de envio.", true);
        return;
    }

    toggleChecklistNoBanco(modalDasEmpresaId, 'das', true, valor).then(sucesso => {
        if (sucesso) {
            $('dlg-das').close();
            const empresa = empresas.find(e => e.id === modalDasEmpresaId);
            if (empresa) {
                carregarChecklistDaEmpresa(modalDasEmpresaId).then(cache => {
                    renderizarChecklist(empresa, cache);
                });
            }
        }
    });
}


function abrirModalIss(empresaId, valorAtual, checkboxEl) {
    modalIssEmpresaId = empresaId;
    modalIssCheckboxEl = checkboxEl;

    const dlg = $('dlg-iss');
    const input = $('input-iss-modal');
    
    if (input) input.value = valorAtual ? valorAtual : '';

    if (!dlg.open) dlg.showModal();
    if (input) setTimeout(() => input.focus(), 50);
}

function fecharModalIss() {
    $('dlg-iss').close();
    if (modalIssCheckboxEl) modalIssCheckboxEl.checked = false;
}

function confirmarModalIss() {
    const input = $('input-iss-modal');
    let v = input.value.replace(/[^\d,]/g, '');

    if (!v || v.trim() === '') {
        toast("Informe o percentual do ISS para continuar.", true);

    }

    toggleChecklistNoBanco(modalIssEmpresaId, 'aliquotaIss', true, v).then(sucesso => {
        if (sucesso) {
            $('dlg-iss').close();
            const empresa = empresas.find(e => e.id === modalIssEmpresaId);
            if (empresa) {
                carregarChecklistDaEmpresa(modalIssEmpresaId).then(cache => {
                    renderizarChecklist(empresa, cache);
                });
            }
        }

}

async function abrirHistorico(empresaId, obrigacaoId, nomeObrigacao) {
    const dlg = $('dlg-historico');
    $('hist-titulo').textContent = 'Histórico · ' + nomeObrigacao;
    $('hist-sub').textContent = rotuloCompetencia(competenciaAtual);
    $('hist-lista').innerHTML = `<div class="hist-vazio">Carregando…</div>`;

    if (!dlg.open) dlg.showModal();

    try {
        const r = await fetch(
            `${API_URL}/api/rotinas/historico?empresaId=${empresaId}&obrigacaoId=${encodeURIComponent(obrigacaoId)}&competencia=${competenciaAtual}`,
            { credentials: 'include' }
        );
        if (!r.ok) throw new Error('Falha ao buscar histórico');
        const dados = await r.json();
        const lista = dados.historico || [];

        if (lista.length === 0) {
            $('hist-lista').innerHTML = `<div class="hist-vazio">Nenhuma ação registrada para esta obrigação nesta competência.</div>`;
            return;
        }

        $('hist-lista').innerHTML = lista.map(h => {
            const marcou = h.acao === 'marcou';
            const quem = h.usuario_nome ? esc(h.usuario_nome) : '—';
            const sufixo = obrigacaoId === 'aliquotaIss' ? '%' : '';
            const valorTxt = h.valor ? ` (${esc(h.valor)}${sufixo})` : '';
            return `
                <div class="hist-item">
                    <div class="hist-icone ${marcou ? 'marcou' : 'desmarcou'}">
                        ${ico(marcou ? 'check' : 'alert')}
                    </div>
                    <div class="hist-corpo">
                        <div class="hist-acao ${marcou ? 'marcou' : 'desmarcou'}">
                            ${marcou ? 'Marcou como concluída' : 'Desmarcou'}${valorTxt}
                        </div>
                        <span class="hist-quando">
                            por <span class="hist-quem">${quem}</span> · ${formatarDataHora(h.criado_em)}
                        </span>
                    </div>
                </div>`;
        }).join('');
    } catch (e) {
        console.error(e);
        $('hist-lista').innerHTML = `<div class="hist-vazio">Erro ao carregar histórico.</div>`;
    }
}

async function abrirChecklist(empresaId) {
    const empresa = empresas.find(e => e.id === empresaId);
    if (!empresa) return;
    empresaAberta = empresa;
    $('tela-rotinas-lista').classList.add('escondido');
    $('tela-rotinas-check').classList.remove('escondido');
    reiniciarAnimacao($('tela-rotinas-check'));
    window.scrollTo(0, 0);

    atualizarSeletorCompetencia();
    const cacheBanco = await carregarChecklistDaEmpresa(empresaId);
    renderizarChecklist(empresa, cacheBanco);
}

function voltarRotinas() {
    empresaAberta = null;
    $('tela-rotinas-check').classList.add('escondido');
    $('tela-rotinas-lista').classList.remove('escondido');
    reiniciarAnimacao($('tela-rotinas-lista'));
    atualizarSeletorCompetencia();
    renderizarRotinas();
}

function renderizarChecklist(empresa, cacheBanco) {
    const obrigacoes = obrigacoesDoRegime(empresa);

    $('check-titulo').textContent = empresa.nomeFantasia;
    
    // Adiciona as badges na descrição (subtítulo) da empresa
    const regimeBadge = `<span class="badge r-${REGIMES[empresa.regime] || 'neutro'}" style="transform: scale(0.9); transform-origin: left center; margin-left: 8px;">${esc(empresa.regime)}</span>`;
    const tipoBadge = `<span class="badge ${empresa.tipoTributacao === 'Ambos' ? 'badge-ambos' : 'r-' + empresa.tipoTributacao.toLowerCase()}" style="transform: scale(0.9); transform-origin: left center; margin-left: 4px;">${esc(empresa.tipoTributacao)}</span>`;

    $('check-sub').innerHTML = `${esc(empresa.razaoSocial)} ${empresa.cnpj ? '· ' + esc(empresa.cnpj) : ''} <div class="badge-grupo" style="display:inline-flex; margin-left: 8px; vertical-align: middle;">${regimeBadge}${tipoBadge}</div>`;

    let feitos = 0;
    obrigacoes.forEach(o => { if (cacheBanco[o.id]?.concluida) feitos++; });
    const total = obrigacoes.length;
    const pct = total > 0 ? Math.round((feitos / total) * 100) : 0;

    $('check-header').innerHTML = `
        <div class="empresa-info">
            <div class="sigla" aria-hidden="true">${esc(sigla(empresa.nomeFantasia))}</div>
            <div>
                <strong>${esc(empresa.nomeFantasia)}</strong>
                <span>${esc(empresa.regime)}</span>
            </div>
        </div>
        <div class="progresso-wrapper">
            <span class="progresso-texto">${feitos}/${total} itens</span>
            <div class="progresso-barra">
                <div class="progresso-preenchido ${pct === 100 ? 'completo' : ''}" style="width:${pct}%"></div>
            </div>
            <span class="progresso-texto">${pct}%</span>
        </div>
    `;

    if (obrigacoes.length === 0) {
        $('check-lista').innerHTML = `<div class="vazio"><strong>Nenhuma obrigação definida</strong>Configure as regras.</div>`;
        return;
    }

    $('check-lista').innerHTML = obrigacoes.map(o => {
        const config = regras[empresa.regime]?.[o.id] || {};
        const info = cacheBanco[o.id] || {};
        const feito = !!info.concluida;

        let opcoesHtml = '';
        if (o.opcoes && config.opcoes && config.opcoes.length > 0) {
            opcoesHtml = `<div class="checklist-opcoes">${config.opcoes.map(op => `<span class="tag">${esc(op)}</span>`).join('')}</div>`;
        }

         let valorHtml = '';
        if (o.id === 'aliquotaIss' && info.valor) {
            valorHtml = `<span class="checklist-valor">${esc(info.valor)}%</span>`;
        } else if (o.id === 'das' && info.canal_envio) {
                    valorHtml = `<span class="tag" style="margin-left: 8px; color: var(--accent); border-color: var(--accent);">${esc(info.canal_envio)}</span>`;
                }

        let auditoriaHtml = '';
        if (feito && info.concluida_em) {
            const quem = info.concluida_por_nome ? esc(info.concluida_por_nome) : '—';
            const quando = formatarDataHora(info.concluida_em);
            auditoriaHtml = `
                <span class="checklist-auditoria">
                    ${ico('user')} ${quem} · ${quando}
                </span>`;
        }

        const nomeObrEsc = esc(o.nome).replace(/'/g, "\\'");
                const histBtn = `
            <button type="button" class="icone-btn hist-btn" title="Ver histórico"
                aria-label="Ver histórico de ${esc(o.nome)}"
                onclick="event.preventDefault(); event.stopPropagation(); abrirHistorico(${empresa.id}, '${o.id}', '${nomeObrEsc}')">
                ${ico('history')}
            </button>`;

        return `
                    <label class="checklist-item ${feito ? 'feito' : ''}">
                        <input type="checkbox" class="checkbox-custom" ${feito ? 'checked' : ''}
                            onclick="event.stopPropagation(); aoClicarChecklist(${empresa.id}, '${o.id}', '${nomeObrEsc}', this)">
                        <span class="checklist-nome">${esc(o.nome)}</span>
                        ${opcoesHtml}
                        ${valorHtml}
                        ${auditoriaHtml}
                        ${histBtn}
                    </label>`;
    }).join('');
}

let desmarcarPendente = null;

function fecharModalDesmarcar() {
    const dlg = $('dlg-desmarcar');
    if (dlg) dlg.close();
    if (desmarcarPendente && desmarcarPendente.checkboxEl) {
        desmarcarPendente.checkboxEl.checked = true;
    }
    desmarcarPendente = null;
}

async function confirmarDesmarcar() {
    if (!desmarcarPendente) return;
    const { empresaId, obrigacaoId, checkboxEl } = desmarcarPendente;
    $('dlg-desmarcar').close();

    const sucesso = await toggleChecklistNoBanco(empresaId, obrigacaoId, false, null);
    if (sucesso) {
        const empresa = empresas.find(e => e.id === empresaId);
        if (empresa) {
            const cacheBanco = await carregarChecklistDaEmpresa(empresaId);
            renderizarChecklist(empresa, cacheBanco);
        }
    } else {
        if (checkboxEl) checkboxEl.checked = true;
    }
    desmarcarPendente = null;
}

function solicitarDesmarcacao(empresaId, obrigacaoId, nomeObrigacao, checkboxEl) {
    desmarcarPendente = { empresaId, obrigacaoId, checkboxEl };
    $('desmarcar-nome').textContent = nomeObrigacao;
    const dlg = $('dlg-desmarcar');
    if (!dlg.open) dlg.showModal();
}

function aoClicarChecklist(empresaId, obrigacaoId, nomeObrigacao, checkboxEl) {
    const estaMarcando = checkboxEl.checked;

    // Se estiver desmarcando, reverte visualmente e abre a confirmação
    if (!estaMarcando) {
        checkboxEl.checked = true;
        solicitarDesmarcacao(empresaId, obrigacaoId, nomeObrigacao, checkboxEl);
        return;
    }

    // Se estiver marcando a Guia DAS, pede o canal (whats, email, etc)
    if (obrigacaoId === 'das') {
        checkboxEl.checked = false;
        abrirModalDas(empresaId, '', checkboxEl);
        return;
    }

    // Se estiver marcando a Alíquota ISS, pede o valor
    if (obrigacaoId === 'aliquotaIss') {
        checkboxEl.checked = false;
        abrirModalIss(empresaId, '', checkboxEl);
        return;
    }

    // Qualquer outro item salva direto como marcado
    toggleChecklist(empresaId, obrigacaoId, true, checkboxEl);
}


async function toggleChecklist(empresaId, obrigacaoId, feito, el) {
    let valor = null;
    if (obrigacaoId === 'aliquotaIss') {
        const cache = await carregarChecklistDaEmpresa(empresaId);
        valor = cache['aliquotaIss']?.valor || null;
    }

    const sucesso = await toggleChecklistNoBanco(empresaId, obrigacaoId, feito, valor);

    if (sucesso) {
        const empresa = empresas.find(e => e.id === empresaId);
        if (empresa) {
            const cacheBanco = await carregarChecklistDaEmpresa(empresaId);
            renderizarChecklist(empresa, cacheBanco);
        }
    } else {
        el.checked = !feito;
    }
}

function filtrarRotinas() {
    termoBuscaRotinas = $('busca-rotinas').value.toLowerCase();
    paginaRotinas = 1;
    renderizarRotinas();
}

function obterEmpresasRotinas() {
    return empresas.filter(e =>
        e.nomeFantasia.toLowerCase().includes(termoBuscaRotinas) ||
        e.razaoSocial.toLowerCase().includes(termoBuscaRotinas)
    );
}

async function renderizarRotinas() {
    const lista = obterEmpresasRotinas();
    const total = lista.length;
    const totalPaginas = Math.ceil(total / ITENS_POR_PAGINA);

    if (paginaRotinas > totalPaginas && totalPaginas > 0) paginaRotinas = totalPaginas;

    const inicio = (paginaRotinas - 1) * ITENS_POR_PAGINA;
    const fim = inicio + ITENS_POR_PAGINA;
    const itensPagina = lista.slice(inicio, fim);

    $('resumo-rotinas').textContent = plural(empresas.length, 'empresa', 'empresas');

    const corpo = $('corpo-rotinas');
    if (itensPagina.length === 0) {
        corpo.innerHTML = `<tr><td colspan="4" class="vazio"><strong>Nenhuma empresa encontrada</strong>Tente outro termo de busca.</td></tr>`;
    } else {
        const htmlPromessas = itensPagina.map(async (e, i) => {
            const cache = await carregarChecklistDaEmpresa(e.id);
            const obrigacoes = obrigacoesDoRegime(e);

            let feitos = 0;
            obrigacoes.forEach(o => { if (cache[o.id]?.concluida) feitos++; });
            const totalObs = obrigacoes.length;
            const pct = totalObs > 0 ? Math.round((feitos / totalObs) * 100) : 0;

            // Criação das Badges na lista
            const badgeRegime = `<span class="badge r-${REGIMES[e.regime] || 'neutro'}">${esc(e.regime)}</span>`;
            const badgeAtividade = `<span class="badge ${e.tipoTributacao === 'Ambos' ? 'badge-ambos' : 'r-' + e.tipoTributacao.toLowerCase()}">${esc(e.tipoTributacao)}</span>`;

            return `
            <tr class="linha" onclick="abrirChecklist(${e.id})">
                <td class="c-num">${inicio + i + 1}</td>
                <td class="c-emp">
                    <div class="empresa">
                        <div class="sigla" aria-hidden="true">${esc(sigla(e.nomeFantasia))}</div>
                        <div><strong>${esc(e.nomeFantasia)}</strong><span>${esc(e.razaoSocial)}</span></div>
                    </div>
                </td>
                <td class="c-regime">
                    <div class="badge-grupo">
                        ${badgeRegime}
                        ${badgeAtividade}
                    </div>
                </td>
                <td class="c-progresso">
                    <div class="progresso-wrapper">
                        <span class="progresso-texto">${feitos}/${totalObs}</span>
                        <div class="progresso-barra">
                            <div class="progresso-preenchido ${pct === 100 ? 'completo' : ''}" style="width:${pct}%"></div>
                        </div>
                        <span class="progresso-texto">${pct}%</span>
                    </div>
                </td>
            </tr>`;
        });

        const htmlFinal = await Promise.all(htmlPromessas);
        corpo.innerHTML = htmlFinal.join('');
    }

    $('info-pag-rotinas').textContent = total === 0 ? 'Nenhum resultado' : `Mostrando ${inicio + 1}–${Math.min(fim, total)} de ${total}`;
    renderizarPaginacaoRotinas(totalPaginas);
}

function renderizarPaginacaoRotinas(totalPaginas) {
    const container = $('paginacao-rotinas');
    container.innerHTML = "";
    if (totalPaginas <= 1) return;

    const criar = (html, onclick, extra = {}) => {
        const b = document.createElement('button');
        b.type = 'button';
        b.innerHTML = html;
        b.onclick = onclick;
        Object.assign(b, extra);
        container.appendChild(b);
        return b;
    };

    criar(ico('prev'), () => { paginaRotinas--; renderizarRotinas(); }, { disabled: paginaRotinas === 1, ariaLabel: 'Página anterior' });

    const paginas = [...new Set([1, paginaRotinas - 1, paginaRotinas, paginaRotinas + 1, totalPaginas])]
        .filter(p => p >= 1 && p <= totalPaginas).sort((a, b) => a - b);
    let anterior = 0;
    paginas.forEach(p => {
        if (p - anterior > 1) {
            const r = document.createElement('span');
            r.className = 'reticencias';
            r.textContent = '…';
            container.appendChild(r);
        }
        const b = criar(p, () => { paginaRotinas = p; renderizarRotinas(); });
        if (p === paginaRotinas) { b.classList.add('ativo'); b.setAttribute('aria-current', 'page'); }
        anterior = p;
    });

    criar(ico('next'), () => { paginaRotinas++; renderizarRotinas(); }, { disabled: paginaRotinas === totalPaginas, ariaLabel: 'Próxima página' });
}

const ehCelular = () => matchMedia('(max-width: 760px)').matches;

function aplicarMenu() {
    const texto = document.documentElement.dataset.menu === 'recolhido' ? 'Expandir menu' : 'Recolher menu';
    const b = $('btn-menu');
    if (b) {
        b.title = texto;
        b.setAttribute('aria-label', texto);
        b.querySelector('.rotulo').textContent = texto;
    }
}

function definirMenu(m) {
    document.documentElement.dataset.menu = m;
    try { if (!ehCelular()) localStorage.setItem('menu', m); } catch (e) {}
    aplicarMenu();
}

function alternarMenu() {
    definirMenu(document.documentElement.dataset.menu === 'recolhido' ? 'aberto' : 'recolhido');
}

function irPara(v) {
    if (v === 'dashboard') { window.location.href = 'dashboard.html'; return; }
    if (v === 'rotinas') { voltarRotinas(); return; }
    if (v === 'usuarios') { window.location.href = 'usuarios.html'; return; }
    if (v === 'permissoes') { window.location.href = 'permissoes.html'; return; }
    if (v === 'regras') { window.location.href = 'index.html#regras'; return; }
    if (v === 'empresas') { window.location.href = 'index.html#empresas'; return; }
    window.location.href = 'index.html';
}

document.addEventListener('DOMContentLoaded', () => {
    aplicarMenu();
    carregarRegras();
    atualizarSeletorCompetencia();
    carregarEmpresasDoBanco();
});
